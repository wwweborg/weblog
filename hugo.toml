baseURL = 'https://example.org/'
locale = 'en-US'
title = 'Weblog'

[markup.highlight]
  noClasses = false

[pagination]
  pagerSize = 5

[params]
  handle = '@yourname'
  avatar = '/images/avatar.png'

[menus]
  [[menus.main]]
    name = 'Home'
    pageRef = '/'
    weight = 10
    [menus.main.params]
      icon = 'home'

  [[menus.main]]
    name = 'Blog'
    pageRef = '/posts'
    weight = 20
    [menus.main.params]
      icon = 'book-open'

  [[menus.main]]
    name = 'About'
    pageRef = '/about'
    weight = 30
    [menus.main.params]
      icon = 'user'

  [[menus.social]]
    name = 'GitHub'
    url = 'https://github.com/wwweborg/weblog'
    weight = 10
    [menus.social.params]
      icon = 'github'

  [[menus.social]]
    name = 'Instagram'
    url = 'https://instagram.com/yourname'
    weight = 20
    [menus.social.params]
      icon = 'instagram'
    
  [[menus.social]]
    name = 'Threads'
    url = 'https://threads.com/yourname'
    weight = 30
    [menus.social.params]
      icon = 'threads'

  [[menus.social]]
    name = 'LinkedIn'
    url = 'https://linkedin.com/yourname'
    weight = 40
    [menus.social.params]
      icon = 'linkedin'
