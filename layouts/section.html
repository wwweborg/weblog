{{ define "main" }}
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  <div class="post-list">
  {{ range .Pages }}
    <article class="post-card">
      <h2><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h2>
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
      <div class="post-card__summary">{{ .Summary }}</div>
    </article>
  {{ end }}
  </div>
{{ end }}
